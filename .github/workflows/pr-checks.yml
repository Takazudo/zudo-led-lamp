# Pull request quality checks and preview deployment for the doc/ site.
#
# Triggered on PRs targeting `main` or any `base/**` worktree base branch (so
# topic PRs that target a base branch also get a preview), when the PR touches
# doc/, the repo-root Claude resources the site publishes, or this workflow.
# Pipeline: type check -> build -> generated-docs drift check -> deploy
# preview (wrangler versions upload --preview-alias) -> sticky PR comment.
#
# Secret gating: same readiness-step pattern as main-deploy.yml — the
# `secrets` context is not available in job-level `if:` expressions. Until
# CLOUDFLARE_API_TOKEN is set, the preview deploy is skipped with an explicit
# notice and the sticky comment falls back to "preview pending" text; the job
# stays GREEN, never red.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers: Edit scope (user sets this manually)
#   CLOUDFLARE_ACCOUNT_ID — already set via `gh secret set` from `wrangler whoami`

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - "base/**"
    paths:
      - "doc/**"
      # The site publishes repo-root Claude resources — doc/zfb.config.ts sets
      # claudeResources.claudeDir "../.claude" and scanRoot "..", so these
      # inputs change the built site despite living outside doc/.
      - ".claude/skills/**"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".github/workflows/pr-checks.yml"

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks-and-preview:
    name: Check and Preview Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}
          # The pnpm version comes from `packageManager` in doc/package.json —
          # there is no package.json at the repo root, which is where this
          # action looks by default.
          package_json_file: doc/package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doc/pnpm-lock.yaml

      # `pnpm build` runs `generate:components` first, which shells out to the
      # component-spec validator (python3). Pinned to the same 3.12 as
      # component-spec-skills.yml so the two never disagree, rather than
      # relying on whatever the runner image happens to ship.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: doc
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: doc
        run: pnpm check

      - name: Build site
        working-directory: doc
        run: pnpm build

      # The claude-resources generator rewrites doc/src/content/docs/claude*/
      # on every build, and that output is committed. A source edit under
      # .claude/skills/ or a CLAUDE.md that lands without a rebuild would leave
      # the committed pages stale; this fails the PR instead. Same contract as
      # the boards regen-idempotency check in component-spec-skills.yml.
      - name: Generated Claude docs are up to date
        run: git diff --exit-code -- doc/src/content/docs

      - name: Check secret readiness
        id: readiness
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deploy skipped — CLOUDFLARE_API_TOKEN is not set yet. See doc/src/content/docs/how-to/ci-cloudflare-setup.mdx."
          fi

      - name: Write dist/.assetsignore
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        # The adapter already writes this at build time; this defensive
        # rewrite guarantees the deploy excludes the worker bundle files
        # even if a future adapter version stops emitting it. Never committed.
        run: printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy PR preview to Cloudflare Workers
        id: cf-deploy
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ALIAS="pr-${PR_NUMBER}"
          WRANGLER_VERSION=$(node -p "require('./package.json').devDependencies.wrangler")
          # wrangler versions upload prints the stable preview-alias URL
          # (on *.workers.dev — requires preview_urls = true in wrangler.toml)
          # to stdout/stderr. Capture both via tee and grep the alias URL line.
          DEPLOY_LOG=$(mktemp)
          npx "wrangler@${WRANGLER_VERSION}" versions upload \
            --preview-alias "$ALIAS" \
            2>&1 | tee "$DEPLOY_LOG"
          # `|| true` is required: under GitHub Actions' default `bash -eo pipefail`,
          # grep finding no match makes this assignment's pipeline fail, which would
          # abort the script here (skipping the graceful "no URL yet" handling below)
          # instead of falling through to it.
          DEPLOY_URL=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1 || true)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          if [ -z "$DEPLOY_URL" ]; then
            # Non-fatal: the worker upload can succeed with no printed
            # preview-alias URL (e.g. workers.dev subdomain not enabled yet).
            echo "::warning::No preview-alias URL found in wrangler output. Worker upload succeeded."
            exit 0
          fi
          echo "Preview URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = context.issue.number;
            const marker = '<!-- cf-preview-pr -->';
            const sha = context.sha.substring(0, 7);

            const body = deployUrl
              ? [
                  marker,
                  `## Cloudflare Workers Preview`,
                  '',
                  `Preview deployment is ready.`,
                  '',
                  `| | URL |`,
                  `|---|---|`,
                  `| Preview | ${deployUrl} |`,
                  '',
                  `Built from commit: \`${sha}\``,
                ].join('\n')
              : [
                  marker,
                  `## Cloudflare Workers Preview`,
                  '',
                  `⏳ **Preview pending.** No preview URL is available yet — this is expected until \`CLOUDFLARE_API_TOKEN\` is configured (see \`doc/src/content/docs/how-to/ci-cloudflare-setup.mdx\`), or the worker uploaded but wrangler printed no \`*.workers.dev\` alias URL.`,
                  '',
                  `Built from commit: \`${sha}\``,
                ].join('\n');

            // Look for an existing comment from this workflow to update in-place
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing preview comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new preview comment');
            }
