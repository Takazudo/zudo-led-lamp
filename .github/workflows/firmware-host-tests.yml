# Board L firmware host tests: the V72 portable C host test and the target-skeleton
# host tests (boot policy, off-by-default contract, ADC sample path). Host compiler
# only; no ARM toolchain, no hardware.

name: Firmware host tests

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-host-tests.yml'
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-host-tests.yml'

concurrency:
  group: firmware-host-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  host-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compiler version
        run: cc --version
      - name: V72 and target host tests
        run: make -C firmware/board-l/target host-test target-host-test
