# Production deployment workflow for the doc/ site.
#
# Triggered on every push to `main` that touches doc/ or this workflow.
# Builds the zfb static site and deploys it to Cloudflare Workers static
# assets.
#
# Every gate before the deploy is credential-free and mandatory: type check,
# component generator tests, build, generated-doc drift, component projection
# drift, denied-value scan over the built bytes. A missing deployment
# credential skips the deploy, never a gate.
#
# The custom domain (zudo-led-lamp.takazudomodular.com) and the workers.dev
# subdomain are both attached declaratively via doc/wrangler.toml
# (workers_dev = true, [[routes]] custom_domain = true) — `wrangler deploy`
# handles both on its own. Verified with a manual first deploy: no separate
# Cloudflare API "cutover" call was needed, so this workflow does not carry
# one.
#
# Secret gating: the `secrets` context is not available in job-level `if:`
# expressions, so a readiness step below maps secrets into env and emits a
# `ready` step output; the deploy steps are gated on that output. Until
# CLOUDFLARE_API_TOKEN is set (the one manual step — see
# doc/src/content/docs/how-to/ci-cloudflare-setup.mdx) the deploy is skipped
# with an explicit notice and the job stays GREEN, never red.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers: Edit scope (user sets this manually)
#   CLOUDFLARE_ACCOUNT_ID — already set via `gh secret set` from `wrangler whoami`

name: Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      # The site publishes repo-root Claude resources — doc/zfb.config.ts sets
      # claudeResources.claudeDir "../.claude" and scanRoot "..", so these
      # inputs change the built site despite living outside doc/.
      - ".claude/skills/**"
      # Canonical package geometry is outside doc/, but is hashed by the
      # committed footprint-preview manifest.
      - "footprints/**/*.kicad_mod"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - "footprints/**/*.wrl"
      - "footprints/**/*.step"
      - ".github/workflows/main-deploy.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          dest: ~/setup-pnpm-${{ github.job }}
          # The pnpm version comes from `packageManager` in doc/package.json —
          # there is no package.json at the repo root, which is where this
          # action looks by default.
          package_json_file: doc/package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doc/pnpm-lock.yaml

      # `pnpm build` runs `generate:components` first, which shells out to the
      # component-spec validator (python3). Pinned to the same 3.12 as
      # component-spec-skills.yml so the two never disagree, rather than
      # relying on whatever the runner image happens to ship.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: doc
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: doc
        run: pnpm check

      - name: Published package models are safe and up to date
        working-directory: doc
        run: pnpm check:models

      - name: Component generator tests
        working-directory: doc
        run: pnpm test:components

      - name: Footprint previews are current and safe
        working-directory: doc
        run: pnpm check:footprint-previews

      - name: Build site
        working-directory: doc
        run: pnpm build

      - name: Package model viewer browser smoke
        working-directory: doc
        run: pnpm test:model-viewer:browser

      # The gap this closes: the job built fresh output but never compared it
      # to what was committed, so a direct push carrying stale generated pages
      # deployed a rebuilt site while the repository kept claiming otherwise.
      # Every committed generated file is covered — claude*/ from the
      # claude-resources generator, components/ and preflight.json from
      # `generate:components`, which `pnpm build` runs first. See pr-checks.yml
      # for why `--intent-to-add` and the explicit preflight.json path are both
      # required rather than tidy.
      - name: Generated output is committed and up to date
        run: |
          git add --intent-to-add -A -- doc/src/content/docs doc/component-docs/preflight.json doc/public/assets/component-previews/models
          git diff --exit-code -- doc/src/content/docs doc/component-docs/preflight.json doc/public/assets/component-previews/models

      # The second generation run: build wrote the tree, this re-projects from
      # the evidence and proves the result byte-identical.
      - name: Component generation is deterministic
        working-directory: doc
        run: pnpm check:components

      # Last check on the exact bytes about to go live: no value reachable only
      # through a denied provider key reaches a published artifact, and the
      # fields the contract promises a reader are all still there. After
      # `build` because `dist/` is its input, and before the deploy because
      # that is the point.
      - name: Denied-value scan over the built site
        working-directory: doc
        run: pnpm scan:artifacts

      # Not run here: the zfb link check (pr-checks.yml carries the reasoning
      # and the gate). It is a pre-merge concern — after a merge, refusing to
      # publish the site over a broken link in prose is a worse outcome than
      # publishing it. The gates above are different: they guard whether the
      # deployed bytes are correct and safe, so they do block the deploy.

      - name: Check secret readiness
        id: readiness
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — CLOUDFLARE_API_TOKEN is not set yet. See doc/src/content/docs/how-to/ci-cloudflare-setup.mdx."
          fi

      - name: Write dist/.assetsignore
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        # The adapter already writes this at build time; this defensive
        # rewrite guarantees the deploy excludes the worker bundle files
        # even if a future adapter version stops emitting it. Never committed.
        run: printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers (production)
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        run: |
          WRANGLER_VERSION=$(node -p "require('./package.json').devDependencies.wrangler")
          npx "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
