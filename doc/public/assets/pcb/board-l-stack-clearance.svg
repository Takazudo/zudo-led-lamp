<text x="625" y="163" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Board P translates +16.50 mm in X.</text>
<text x="625" y="187" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Both upper pillar pairs stay aligned.</text>
<text x="625" y="211" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Board P and the mounting holes are unchanged.</text>
<text x="625" y="266" font-family="Arial,sans-serif" font-size="20" fill="#17332b" text-anchor="start">Six contacts stay aligned</text>
<text x="625" y="299" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">J2 retains its verified position and rotation.</text>
<text x="625" y="323" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">1–2: supply  •  3: ATT  •  4: PDOK</text>
<text x="625" y="347" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">5–6: ground; pin 1 mates with pin 1.</text>
<text x="625" y="402" font-family="Arial,sans-serif" font-size="20" fill="#17332b" text-anchor="start">Rear controls outside the stack</text>
<text x="625" y="435" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Encoder footprint clearance: 1.39 mm.</text>
<text x="625" y="459" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">SW2 courtyard clearance: 3.40 mm.</text>
<text x="625" y="483" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">C496154 toggle is soldered into rear slots.</text>
<text x="625" y="507" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Support its bushing/nut in the enclosure.</text>
<text x="625" y="531" font-family="Arial,sans-serif" font-size="15" fill="#17332b" text-anchor="start">Rear reach ≈28.7 mm; front lugs ≈1.9 mm.</text>
<text x="90" y="615" font-family="Arial,sans-serif" font-size="16" fill="#17332b" text-anchor="start">Board L: 60 × 60 mm. This drawing checks XY placement; stack height is not shown.</text>
<text x="90" y="642" font-family="Arial,sans-serif" font-size="14" fill="#53675e" text-anchor="start">The dashed third hole belongs to Board P only. Cutout, solder and operating clearance need a prototype.</text>
