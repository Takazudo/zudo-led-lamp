# pnpm 11 defaults minimumReleaseAge to 1440min; its exclude matcher can't match this project's peer-nested lockfile keys (upstream pnpm bug), so disable the gate outright.
minimumReleaseAge: 0

# wrangler's native binaries (bundler + local Worker runtime) need their
# postinstall scripts to fetch platform binaries.
allowBuilds:
  esbuild: true
  workerd: true
